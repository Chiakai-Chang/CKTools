<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>網路巡邏情資分析系統 v3.1</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for Browser JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- WordCloud2 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/wordcloud2.js/1.2.2/wordcloud2.min.js"></script>
    <!-- Vis-Network -->
    <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-slate-950">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- 核心字典與情感配置 ---
        const THREAT_SINGLE_CHARS = new Set(['砍', '炸', '殺', '死', '槍', '彈', '刀', '血', '恨', '仇', '爆']);
        const CORE_DICT = [
            '隨機殺人', '恐怖攻擊', '丟煙霧彈', '完成任務', '接下去', '精神傳承', '第五縱隊',
            '台北車站', '高雄車站', '台中車站', '板南線', '捷運車廂', '小港機場', '新光三越', 
            '台中新光', '台中秀泰', '豐原愛買', '中央公園', '麥當勞', '中山站', '市政府', '西門', '北投',
            '土製炸彈', '手榴彈', '開山刀', '汽油彈', '硝酸銨', '張文', '鄭捷', '文弟', '吳明璋',
            '12月25日', '12月31日', '跨年', '凌晨'
        ];

        const SENTIMENT_MAP = {
            '隨機殺人': 98, '恐怖攻擊': 95, '炸死': 95, '砍死': 92, '土製炸彈': 95, '手榴彈': 92,
            '張文': 90, '鄭捷': 88, '12月25日': 95, '12月31日': 90, '板南線': 92, '新光三越': 88,
            '完成任務': 85, '接下去': 85, '丟煙霧彈': 88, '砍': 92, '炸': 95, '殺': 95
        };

        const STOP_WORDS = new Set([
            '的', '了', '在', '我', '你', '他', '她', '們', '是', '一個', '也才', '也是', '這部', '這個', '就是', '因為', '所以', '但是', '我們', '今天', '已經', '真的', '什麼', '大家', '都是', '起來', '現在', '還是', '內容', '請問', '怎麼', '知道', '指示', '原本', '計劃', '表示', '需要', '可能', '長期', '如果', '結果', '準備', '事件', '哈哈', '那些', '這些', '一些', '一點', '一樣', '一下'
        ]);

        const App = () => {
            const [inputText, setInputText] = useState('');
            const [analysisData, setAnalysisData] = useState({ words: [], edges: [], stats: {} });
            const [activeTab, setActiveTab] = useState('dashboard');
            const [isAnalyzing, setIsAnalyzing] = useState(false);
            
            const cloudCanvasRef = useRef(null);
            const networkRef = useRef(null);
            const networkInstance = useRef(null);

            const tokenize = (text) => {
                let tokens = [];
                const dateRegex = /(\d{1,2}月\d{1,2}日)/g;
                let tempText = text;
                let match;
                while ((match = dateRegex.exec(text)) !== null) {
                    tokens.push(match[0]);
                    tempText = tempText.replace(match[0], ' '.repeat(match[0].length));
                }
                const clean = tempText.replace(/[^\u4e00-\u9fa5a-zA-Z0-9]/g, ' ');
                const segs = clean.split(/\s+/);
                segs.forEach(seg => {
                    let i = 0;
                    while (i < seg.length) {
                        let matched = false;
                        for (let len = 6; len >= 2; len--) {
                            let word = seg.substring(i, i + len);
                            if (CORE_DICT.includes(word)) {
                                tokens.push(word);
                                i += len;
                                matched = true;
                                break;
                            }
                        }
                        if (!matched) {
                            let char = seg[i];
                            if (THREAT_SINGLE_CHARS.has(char)) {
                                tokens.push(char);
                            } else if (i + 1 < seg.length) {
                                let bi = seg.substring(i, i + 2);
                                if (!STOP_WORDS.has(bi) && !/[\d]/.test(bi)) tokens.push(bi);
                            }
                            i++;
                        }
                    }
                });
                return tokens.filter(t => t.length > 1 || THREAT_SINGLE_CHARS.has(t));
            };

            const getCategory = (word) => {
                if (['隨機殺人', '恐怖攻擊', '砍', '炸', '殺', '死', '彈'].some(k => word.includes(k))) return '行動';
                if (['車站', '捷運', '板南', '商場', '新光', '中山', '北投'].some(k => word.includes(k))) return '地點';
                if (['張文', '鄭捷', '組織', '同夥', '兄弟'].some(k => word.includes(k))) return '人物';
                return '一般';
            };

            const performAnalysis = () => {
                if (!inputText.trim()) return;
                setIsAnalyzing(true);
                setTimeout(() => {
                    const lines = inputText.split(/\n/).filter(l => l.trim().length > 0);
                    const wordFreq = {};
                    const coOccurrence = {};
                    lines.forEach(line => {
                        const tokens = tokenize(line);
                        const uniqueTokens = [...new Set(tokens)];
                        tokens.forEach(t => { wordFreq[t] = (wordFreq[t] || 0) + 1; });
                        for (let i = 0; i < uniqueTokens.length; i++) {
                            for (let j = i + 1; j < uniqueTokens.length; j++) {
                                const pair = [uniqueTokens[i], uniqueTokens[j]].sort().join('::');
                                coOccurrence[pair] = (coOccurrence[pair] || 0) + 1;
                            }
                        }
                    });
                    const sortedWords = Object.entries(wordFreq)
                        .sort((a, b) => b[1] - a[1])
                        .map(([text, count]) => ({
                            text,
                            count,
                            sentiment: SENTIMENT_MAP[text] || Math.min(60 + count * 2, 85),
                            category: getCategory(text)
                        }));
                    setAnalysisData({
                        words: sortedWords,
                        edges: Object.entries(coOccurrence).map(([id, weight]) => ({ id, weight })),
                        stats: {
                            totalWords: sortedWords.length,
                            highRisk: sortedWords.filter(w => (SENTIMENT_MAP[w.text] || 0) > 85).length,
                            avgThreat: Math.round(sortedWords.reduce((acc, curr) => acc + (SENTIMENT_MAP[curr.text] || 60), 0) / (sortedWords.length || 1))
                        }
                    });
                    setIsAnalyzing(false);
                }, 600);
            };

            useEffect(() => {
                if (activeTab === 'wordcloud' && analysisData.words.length > 0 && cloudCanvasRef.current && window.WordCloud) {
                    const canvas = cloudCanvasRef.current;
                    canvas.width = canvas.parentElement.clientWidth;
                    canvas.height = 450;
                    window.WordCloud(canvas, {
                        list: analysisData.words.slice(0, 100).map(w => [w.text, Math.sqrt(w.count) * 25 + 10]),
                        fontFamily: 'Noto Sans TC',
                        color: (w) => (SENTIMENT_MAP[w] > 85 || THREAT_SINGLE_CHARS.has(w)) ? '#f87171' : '#60a5fa',
                        rotateRatio: 0,
                        backgroundColor: '#0f172a',
                        gridSize: 12,
                        weightFactor: 1
                    });
                }
                if (activeTab === 'network' && analysisData.words.length > 0 && networkRef.current && window.vis) {
                    const topWords = analysisData.words.slice(0, 40);
                    const nodes = topWords.map(w => ({
                        id: w.text,
                        label: w.text,
                        shape: 'box',
                        margin: 10,
                        font: { size: 16 + (w.count / analysisData.words[0].count) * 20, color: '#fff', face: 'Noto Sans TC' },
                        color: { background: w.sentiment > 85 ? '#7f1d1d' : '#1e3a8a', border: '#3b82f6' }
                    }));
                    const edges = analysisData.edges
                        .filter(e => {
                            const [s, t] = e.id.split('::');
                            return topWords.some(w => w.text === s) && topWords.some(w => w.text === t);
                        })
                        .map(e => ({ from: e.id.split('::')[0], to: e.id.split('::')[1], width: Math.sqrt(e.weight) * 3, color: 'rgba(71, 85, 105, 0.4)' }));
                    if (networkInstance.current) networkInstance.current.destroy();
                    networkInstance.current = new window.vis.Network(networkRef.current, { nodes, edges }, {
                        physics: { solver: 'forceAtlas2Based', forceAtlas2Based: { gravitationalConstant: -150, centralGravity: 0.01, springLength: 200, avoidOverlap: 1 } },
                        interaction: { hover: true, zoomView: true }
                    });
                }
            }, [activeTab, analysisData]);

            return (
                <div className="min-h-screen bg-slate-950 text-slate-200 p-4 lg:p-8">
                    <div className="max-w-7xl mx-auto">
                        <header className="flex flex-col md:flex-row justify-between items-center mb-8 gap-4">
                            <div className="flex items-center gap-3">
                                <div className="bg-blue-600 p-2 rounded-lg shadow-lg">
                                    <i data-lucide="shield" className="w-8 h-8 text-white"></i>
                                </div>
                                <div>
                                    <h1 className="text-2xl font-bold text-white tracking-tight">網路巡邏情資分析系統</h1>
                                    <p className="text-slate-500 text-sm">Patrol Insight Pro v3.1 | 部署就緒版</p>
                                </div>
                            </div>
                            <div className="flex gap-2">
                                <button onClick={() => setInputText('')} className="p-2 hover:bg-slate-800 rounded-lg text-slate-400"><i data-lucide="trash-2"></i></button>
                                <button className="flex items-center gap-2 px-4 py-2 bg-slate-800 hover:bg-slate-700 rounded-lg text-sm font-medium border border-slate-700"><i data-lucide="download" className="w-4 h-4"></i> 匯出 CSV</button>
                            </div>
                        </header>

                        <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
                            <div className="lg:col-span-4 space-y-6">
                                <div className="bg-slate-900/50 border border-slate-800 rounded-2xl p-6 shadow-xl backdrop-blur-sm">
                                    <h2 className="font-bold flex items-center gap-2 mb-4"><i data-lucide="activity" className="text-blue-500 w-4 h-4"></i> 情資輸入區</h2>
                                    <textarea
                                        value={inputText}
                                        onChange={(e) => setInputText(e.target.value)}
                                        className="w-full h-80 bg-slate-950 border border-slate-800 rounded-xl p-4 text-sm focus:ring-2 focus:ring-blue-600 outline-none transition resize-none placeholder-slate-700 font-mono"
                                        placeholder="在此貼上可疑內容..."
                                    />
                                    <button onClick={performAnalysis} disabled={isAnalyzing || !inputText} className="w-full mt-4 py-3 bg-blue-600 hover:bg-blue-500 text-white rounded-xl font-bold transition flex items-center justify-center gap-2">
                                        {isAnalyzing ? "正在掃描..." : "執行深度語義掃描"}
                                    </button>
                                </div>
                                <div className="grid grid-cols-2 gap-4">
                                    <div className="bg-slate-900/50 p-4 rounded-xl border border-slate-800">
                                        <p className="text-[10px] text-slate-500 uppercase font-bold tracking-wider mb-1">高風險詞彙</p>
                                        <span className="text-2xl font-bold text-red-500">{analysisData.stats.highRisk || 0}</span>
                                    </div>
                                    <div className="bg-slate-900/50 p-4 rounded-xl border border-slate-800">
                                        <p className="text-[10px] text-slate-500 uppercase font-bold tracking-wider mb-1">威脅平均值</p>
                                        <span className="text-2xl font-bold text-blue-400">{analysisData.stats.avgThreat || 0}</span>
                                    </div>
                                </div>
                            </div>

                            <div className="lg:col-span-8 space-y-6">
                                <div className="bg-slate-900/50 border border-slate-800 rounded-2xl overflow-hidden shadow-xl min-h-[600px]">
                                    <div className="flex border-b border-slate-800 bg-slate-900/80 text-sm font-bold">
                                        {['dashboard', 'wordcloud', 'network'].map(tab => (
                                            <button key={tab} onClick={() => setActiveTab(tab)} className={`px-6 py-4 transition ${activeTab === tab ? 'text-blue-400 border-b-2 border-blue-400 bg-slate-800/50' : 'text-slate-500 hover:text-slate-300'}`}>
                                                {tab.toUpperCase()}
                                            </button>
                                        ))}
                                    </div>
                                    <div className="p-6 h-full">
                                        {activeTab === 'dashboard' && (
                                            <div className="space-y-6">
                                                <h3 className="text-slate-300 font-bold mb-4 text-lg">關鍵字分析報告</h3>
                                                <div className="overflow-x-auto">
                                                    <table className="w-full text-left text-sm">
                                                        <thead className="text-slate-500 border-b border-slate-800">
                                                            <tr><th>詞彙</th><th>類別</th><th>頻次</th><th className="text-right">威脅權重</th></tr>
                                                        </thead>
                                                        <tbody className="divide-y divide-slate-800">
                                                            {analysisData.words.slice(0, 10).map((word, idx) => (
                                                                <tr key={idx} className="hover:bg-slate-800/30">
                                                                    <td className="py-4 font-bold">{word.text}</td>
                                                                    <td className="py-4 text-xs">
                                                                        <span className={`px-2 py-0.5 rounded-full ${word.category === '行動' ? 'bg-red-900/30 text-red-400' : 'bg-blue-900/30 text-blue-400'}`}>{word.category}</span>
                                                                    </td>
                                                                    <td className="py-4">{word.count} 次</td>
                                                                    <td className="py-4 text-right">
                                                                        <span className={word.sentiment > 85 ? "text-red-500 font-bold" : "text-slate-400"}>{word.sentiment}</span>
                                                                    </td>
                                                                </tr>
                                                            ))}
                                                        </tbody>
                                                    </table>
                                                </div>
                                            </div>
                                        )}
                                        {activeTab === 'wordcloud' && <canvas ref={cloudCanvasRef} className="w-full max-h-[450px]" />}
                                        {activeTab === 'network' && <div ref={networkRef} className="w-full h-[480px]" />}
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
        
        // Initialize Lucide icons
        setTimeout(() => { if(window.lucide) window.lucide.createIcons(); }, 100);
    </script>
</body>
</html>
