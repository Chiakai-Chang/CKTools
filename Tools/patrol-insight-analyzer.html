                        // Optimized Tokenize: Hybrid Approach (Dictionary Priority + Intl.Segmenter)

                                // then feed the rest to Intl.Segmenter.
                                
                                const cleanText = text; // Keep original for segmenter context, clean later
                                
                                // Create a safe regex pattern from active dictionary (descending length)
                                // Note: Constructing a regex for 1000s of words can be slow, but for our size it's acceptable.
                                // For better perf in large scale, we would use Aho-Corasick, but here we iterate.
                                
                                let fragments = [{ text: cleanText, isMatch: false }];
                                
                                // 1. Dictionary Matching Pass (The "Expert" Layer)
                                // We only strictly match high-value targets. For general words, let Segmenter handle it.
                                // Iterating the dict is safer for priority.
                                
                                for (const word of activeCoreDict) {
                                    const newFragments = [];
                                    for (const frag of fragments) {
                                        if (frag.isMatch) {
                                            newFragments.push(frag);
                                            continue;
                                        }
                                        
                                        const parts = frag.text.split(word);
                                        for (let i = 0; i < parts.length; i++) {
                                            if (parts[i]) newFragments.push({ text: parts[i], isMatch: false });
                                            if (i < parts.length - 1) newFragments.push({ text: word, isMatch: true });
                                        }
                                    }
                                    fragments = newFragments;
                                }
            
                                // 2. NLP Pass (The "Robust" Layer)
                                // Use browser native Intl.Segmenter for the non-matching parts
                                const segmenter = new Intl.Segmenter('zh-TW', { granularity: 'word' });
                                
                                fragments.forEach(frag => {
                                    if (frag.isMatch) {
                                        tokens.push(frag.text);
                                    } else {
                                        // Use Native NLP for the gaps
                                        const segments = segmenter.segment(frag.text);
                                        for (const seg of segments) {
                                            if (seg.isWordLike) { // Intl.Segmenter property to skip spaces/punctuation
                                                const t = seg.segment;
                                                // Basic cleaning
                                                if (!STOP_WORDS.has(t) && !/^\d+$/.test(t) && t.length > 1) {
                                                    tokens.push(t);
                                                }
                                                // Keep single char if it's a specific verb
                                                else if (['砍', '炸', '殺', '死'].includes(t)) {
                                                    tokens.push(t);
                                                }
                                            }
                                        }
                                    }
                                });
            
                            } catch (e) { 
                                console.error("Tokenization error:", e);
                                // Fallback to simple split if Intl.Segmenter fails or crashes
                                return text.split('').filter(t => !STOP_WORDS.has(t));
                            }
                            return tokens;

                                const pair = [uniqueTokens[i], uniqueTokens[j]].sort().join('::');
                                coOccurrence[pair] = (coOccurrence[pair] || 0) + 1;
                            }
                        }

                                    <span className="text-[10px] font-mono bg-slate-950 px-2 py-0.5 rounded-lg opacity-50 font-black">{filteredWords.length} 筆</span>
                                </div>
                                <div className="space-y-3">
                                    <select value={categoryFilter} onChange={(e) => setCategoryFilter(e.target.value)} className="w-full bg-slate-800 border border-white/10 rounded-xl px-3 py-2 text-[10px] text-slate-200 outline-none cursor-pointer font-bold">
                                        <option value="全部">所有類別 (含自定義)</option>
                                        <option value="行動/武器">行動/武器</option>
                                        <option value="目標場所">目標場所</option>
                                        <option value="政治人物/暱稱">政治人物/暱稱</option>
                                        <option value="群體/身分">群體/身分</option>
                                        <option value="識別特徵碼">識別特徵碼</option>
                                        {/* Dynamically render custom categories if needed, but 'All' covers it */}
                                    </select>
                                    <div className="flex flex-wrap gap-1.5">
                                        {['極高危', '高風險', '中風險'].map(label => (
                                            <button key={label} onClick={() => toggleRiskFilter(label)} className={`px-2 py-1 rounded-lg text-[9px] font-black border transition-all ${selectedRisks.includes(label) ? (label === '極高危' ? 'bg-red-600 border-red-400 text-white shadow-[0_0_8px_#ef4444]' : label === '高風險' ? 'bg-orange-600 border-orange-400 text-white' : 'bg-yellow-600 border-yellow-400 text-black') : 'bg-slate-800/50 border-white/10 text-slate-500 hover:border-white/30'}`}>{label}</button>
                                        ))}
                                        {selectedRisks.length > 0 && <button onClick={() => setSelectedRisks([])} className="px-2 py-1 text-[9px] text-blue-400 hover:text-white font-bold underline underline-offset-4">RESET</button>}
                                    </div>
                                </div>
                            </div>
                            <div className="flex-1 overflow-y-auto custom-scrollbar">
                                <table className="w-full text-left text-[11px]">
                                    <thead className="sticky top-0 z-10 bg-[#0c1322] shadow-md text-slate-500 uppercase text-[9px] font-black tracking-widest">
                                        <tr><th className="px-4 py-2 border-b border-white/10">情資熱點</th><th className="px-4 py-2 border-b border-white/10 text-right">分級</th></tr>
                                    </thead>
                                    <tbody className="divide-y divide-white/5">
                                        {filteredWords.map((word, idx) => {
                                            const riskL = getRiskLevel(DEFAULT_SUSPECTS.has(word.text) ? 100 : word.sentiment);
                                            const isH = DEFAULT_SUSPECTS.has(word.text) || (activeSentimentMap[word.text] || 0) >= 95;
                                            return (
                                                <tr key={idx} className="risk-row transition">
                                                    <td className="px-4 py-3.5">
                                                        <div className="flex items-center gap-2">
                                                            <span className={`font-black tracking-tight ${isH ? "suspect-highlight" : "text-slate-300"}`}>{word.text}</span>
                                                            <span className="text-[10px] text-blue-500/40 font-black">x{word.count}</span>
                                                        </div>
                                                        <span className="text-[9px] text-slate-600 block italic opacity-70 font-medium tracking-tight uppercase">{word.category}</span>
                                                    </td>
                                                    <td className="px-4 py-3.5 text-right">
                                                        <span className={`px-2 py-0.5 rounded-[4px] text-[8px] font-black border ${getRiskColor(DEFAULT_SUSPECTS.has(word.text) ? 100 : word.sentiment)} uppercase tracking-tighter`}>{riskL}</span>
                                                    </td>
                                                </tr>
                                            );
                                        })}
                                    </tbody>
                                </table>
                            </div>
                        </div>

                        {/* Column 3: Visual Charts (Fixed Physics Overload) */}
                        <div className="lg:col-span-6 content-col gap-6">
                            <div className="glass-panel rounded-3xl p-6 flex-1 flex flex-col shadow-2xl relative min-h-0 overflow-hidden">
                                <div className="flex justify-between items-center mb-3 border-b border-white/5 pb-2">
                                    <h2 className="font-bold flex items-center gap-2 text-slate-400 text-xs uppercase tracking-widest font-black"><i data-lucide="cloud" className="text-blue-500 w-3 h-3"></i> 語義熱度全景圖 (自動適配)</h2>
                                    <div className="flex items-center gap-2">
                                        <input type="range" min="0.3" max="2" step="0.1" value={zoom} onChange={(e) => setZoom(parseFloat(e.target.value))} className="w-16 h-1 accent-blue-500 cursor-pointer"/>
                                        <button onClick={() => setZoom(1)} className="text-[9px] font-bold text-slate-500 hover:text-white font-black uppercase tracking-widest tracking-tighter">FIT</button>
                                    </div>
                                </div>
                                <div ref={viewportRef} className="flex-1 canvas-viewport">
                                    <div className="canvas-container" style={{ transform: `scale(${zoom})` }}><canvas ref={cloudCanvasRef}></canvas></div>
                                </div>
                            </div>
                            <div className="glass-panel rounded-3xl p-6 flex-1 flex flex-col shadow-2xl min-h-0 overflow-hidden text-center relative">
                                <h2 className="font-bold flex items-center gap-2 mb-3 text-slate-400 text-xs uppercase tracking-widest border-b border-white/5 pb-2 font-black text-indigo-400 tracking-tighter">
                                    <i data-lucide="share-2" className="text-indigo-400 w-3 h-3"></i> 情資拓樸網 (智能穩定化版)
                                </h2>
                                <div ref={networkRef} className="flex-1 bg-slate-950/30 rounded-2xl border border-white/5 shadow-inner"></div>
                                <div className="absolute bottom-4 right-4 text-[8px] text-slate-700 font-mono uppercase">Topology display capped at top 150 nodes for stability</div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

            const mount = () => {
                const container = document.getElementById('root');
                if (container && typeof ReactDOM !== 'undefined') {
                    const root = ReactDOM.createRoot(container);
                    root.render(<App />);
                } else { setTimeout(mount, 50); }
            };
            mount();
    </script>
</body>
</html>
