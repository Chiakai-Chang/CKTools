<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>網路巡邏情資分析系統</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for Browser JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- WordCloud2 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/wordcloud2.js/1.2.2/wordcloud2.min.js"></script>
    <!-- Vis-Network -->
    <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #020617; }
        .custom-scrollbar::-webkit-scrollbar { width: 5px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 10px; }
        .glass-panel { background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .risk-row:hover { background: rgba(239, 68, 68, 0.05); }
    </style>
</head>
<body class="text-slate-200 overflow-hidden">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- 核心字典與強化威脅配置 (加入歷史情資) ---
        const THREAT_SINGLE_CHARS = new Set(['砍', '炸', '殺', '死', '槍', '彈', '刀', '血', '恨', '仇', '爆', '捅', '刺']);
        const CORE_DICT = [
            '隨機殺人', '恐怖攻擊', '丟煙霧彈', '完成任務', '精神傳承', '第五縱隊', '射殺人群', '割喉', '燃燒瓶', '塑膠炸彈', 
            '定時炸彈', '遙控炸彈', '爆裂物', '土製炸彈', '手雷', '手槍', 'C4', '塑化劑', '氯酸鉀', '匕首', '硝酸銨',
            '台中歌劇院', '自然科學博物館', '親親影城', '台北101', '桃園國際機場', '市政府站', '東海大學', '高鐵', 
            '新光三越', '台中車站', '中港新光', '台中秀泰', '馬公基地', '國教院', '市政府', '榮總', 'BRT',
            '唐澤貴洋', 'Karasawa', '粘孝帆', '蕭清淵', '蔡傑宏', '余福明', '賴志忠', '黑色豪門企業', '黑社會', '14514 BTC',
            '國有器官', '直播', 'Youtube', 'Facebook', 'TikTok'
        ];

        // 提高凶器與犯罪宣告權重
        const SENTIMENT_MAP = {
            '隨機殺人': 100, '恐怖攻擊': 100, '炸死': 100, '砍死': 100, '射殺': 100, '割喉': 100, '捅刺': 100,
            '塑膠炸彈': 100, '定時炸彈': 100, '遙控炸彈': 100, '爆裂物': 100, 'C4': 100, '手雷': 100, '手槍': 100, '土製炸彈': 100,
            '燃燒瓶': 100, '炸': 100, '殺': 100, '砍': 100, '槍': 100, '彈': 100, '死': 100,
            '唐澤貴洋': 95, '粘孝帆': 95, 'BTC': 90, '引爆': 98, '放置': 90, '12月25日': 95, '12月31日': 95,
            '歌劇院': 90, '科博館': 90, '台中車站': 90, '台北101': 95, '機場': 95, '直播': 85
        };

        const STOP_WORDS = new Set(['的', '了', '在', '我', '你', '他', '她', '們', '是', '一個', '也才', '也是', '這部', '這個', '就是', '因為', '所以', '但是', '我們', '今天', '已經', '真的', '什麼', '大家', '都是', '起來', '現在', '還是', '內容', '請問', '怎麼', '知道', '指示', '原本', '計劃', '表示', '需要', '可能', '長期', '如果', '結果', '準備', '事件', '哈哈', '那些', '這些', '一些', '一點', '一樣', '一下', '你好', '先生', '本人']);

        const App = () => {
            const [inputText, setInputText] = useState('');
            const [analysisData, setAnalysisData] = useState({ words: [], edges: [], stats: {} });
            const [isAnalyzing, setIsAnalyzing] = useState(false);
            
            const cloudCanvasRef = useRef(null);
            const networkRef = useRef(null);
            const networkInstance = useRef(null);

            const tokenize = (text) => {
                let tokens = [];
                const dateRegex = /(\d{1,2}月\d{1,2}日)/g;
                let tempText = text;
                let match;
                while ((match = dateRegex.exec(text)) !== null) {
                    tokens.push(match[0]);
                    tempText = tempText.replace(match[0], ' '.repeat(match[0].length));
                }
                const clean = tempText.replace(/[^\u4e00-\u9fa5a-zA-Z0-9]/g, ' ');
                const segs = clean.split(/\s+/);
                segs.forEach(seg => {
                    let i = 0;
                    while (i < seg.length) {
                        let matched = false;
                        for (let len = 6; len >= 2; len--) {
                            let word = seg.substring(i, i + len);
                            if (CORE_DICT.includes(word)) {
                                tokens.push(word);
                                i += len;
                                matched = true;
                                break;
                            }
                        }
                        if (!matched) {
                            let char = seg[i];
                            if (THREAT_SINGLE_CHARS.has(char)) {
                                tokens.push(char);
                            } else if (i + 1 < seg.length) {
                                let bi = seg.substring(i, i + 2);
                                if (!STOP_WORDS.has(bi) && !/[\d]/.test(bi)) tokens.push(bi);
                            }
                            i++;
                        }
                    }
                });
                return tokens.filter(t => t.length > 1 || THREAT_SINGLE_CHARS.has(t));
            };

            const getCategory = (word) => {
                if (['殺', '炸', '砍', '射', '死', '彈', '槍', '刀', '手雷', 'C4', '爆裂物', '割喉', '燃燒瓶'].some(k => word.includes(k))) return '行動/武器';
                if (['車站', '捷運', '板南', '商場', '新光', '秀泰', '歌劇院', '科博館', '影城', '機場', '101', '大學', '校園', '中心', '百貨'].some(k => word.includes(k))) return '目標場所';
                if (['張文', '鄭捷', '唐澤', '貴洋', '粘孝帆', '蕭清淵', '蔡傑宏', '組織', '同夥', '兄弟'].some(k => word.includes(k))) return '嫌疑主體';
                return '一般性言論';
            };

            const performAnalysis = () => {
                if (!inputText.trim()) return;
                setIsAnalyzing(true);
                setTimeout(() => {
                    const lines = inputText.split(/\n/).filter(l => l.trim().length > 0);
                    const wordFreq = {};
                    const coOccurrence = {};
                    lines.forEach(line => {
                        const tokens = tokenize(line);
                        const uniqueTokens = [...new Set(tokens)];
                        tokens.forEach(t => { wordFreq[t] = (wordFreq[t] || 0) + 1; });
                        for (let i = 0; i < uniqueTokens.length; i++) {
                            for (let j = i + 1; j < uniqueTokens.length; j++) {
                                const pair = [uniqueTokens[i], uniqueTokens[j]].sort().join('::');
                                coOccurrence[pair] = (coOccurrence[pair] || 0) + 1;
                            }
                        }
                    });
                    const sortedWords = Object.entries(wordFreq)
                        .sort((a, b) => b[1] - a[1])
                        .map(([text, count]) => ({
                            text,
                            count,
                            sentiment: SENTIMENT_MAP[text] || Math.min(65 + count * 2, 85),
                            category: getCategory(text)
                        }));
                    setAnalysisData({
                        words: sortedWords,
                        edges: Object.entries(coOccurrence).map(([id, weight]) => ({ id, weight })),
                        stats: {
                            totalWords: sortedWords.length,
                            highRisk: sortedWords.filter(w => (SENTIMENT_MAP[w.text] || 0) >= 95).length,
                            avgThreat: Math.round(sortedWords.reduce((acc, curr) => acc + (SENTIMENT_MAP[curr.text] || 65), 0) / (sortedWords.length || 1))
                        }
                    });
                    setIsAnalyzing(false);
                }, 600);
            };

            useEffect(() => {
                if (analysisData.words.length > 0) {
                    if (cloudCanvasRef.current && window.WordCloud) {
                        const canvas = cloudCanvasRef.current;
                        canvas.width = canvas.parentElement.clientWidth;
                        canvas.height = 350;
                        window.WordCloud(canvas, {
                            list: analysisData.words.slice(0, 150).map(w => [w.text, Math.sqrt(w.count) * 20 + 8]),
                            fontFamily: 'Noto Sans TC',
                            color: (w) => (SENTIMENT_MAP[w] >= 95 || THREAT_SINGLE_CHARS.has(w)) ? '#ef4444' : '#60a5fa',
                            rotateRatio: 0,
                            backgroundColor: 'transparent',
                            gridSize: 10,
                            weightFactor: 1.2
                        });
                    }
                    if (networkRef.current && window.vis) {
                        const topWords = analysisData.words.slice(0, 50);
                        const nodes = topWords.map(w => ({
                            id: w.text,
                            label: w.text,
                            shape: 'box',
                            margin: 10,
                            font: { size: 16 + (w.count / (analysisData.words[0]?.count || 1)) * 25, color: '#fff', face: 'Noto Sans TC' },
                            color: { background: w.sentiment >= 95 ? '#7f1d1d' : '#1e3a8a', border: w.sentiment >= 95 ? '#ef4444' : '#3b82f6' }
                        }));
                        const edges = analysisData.edges
                            .filter(e => {
                                const [s, t] = e.id.split('::');
                                return topWords.some(w => w.text === s) && topWords.some(w => w.text === t);
                            })
                            .map(e => ({ from: e.id.split('::')[0], to: e.id.split('::')[1], width: Math.sqrt(e.weight) * 3, color: 'rgba(71, 85, 105, 0.4)', length: 250 }));
                        if (networkInstance.current) networkInstance.current.destroy();
                        networkInstance.current = new window.vis.Network(networkRef.current, { nodes, edges }, {
                            physics: { solver: 'forceAtlas2Based', forceAtlas2Based: { gravitationalConstant: -120, avoidOverlap: 1 } },
                            interaction: { hover: true, zoomView: true }
                        });
                    }
                }
            }, [analysisData]);

            return (
                <div className="h-screen flex flex-col p-4 lg:p-6 space-y-4">
                    {/* Header */}
                    <header className="flex-none flex flex-col md:flex-row justify-between items-center gap-4 bg-slate-900/80 p-5 rounded-2xl border border-white/5 shadow-2xl">
                        <div className="flex items-center gap-4">
                            <div className="bg-red-600 p-2.5 rounded-xl shadow-lg shadow-red-500/20">
                                <i data-lucide="shield-alert" className="w-6 h-6 text-white"></i>
                            </div>
                            <div>
                                <h1 className="text-xl font-bold text-white tracking-tight">網路巡邏：高風險威脅監測系統</h1>
                                <p className="text-slate-500 text-[11px] uppercase tracking-wider">v3.6 Intelligence Reinforced | Weapon Weight: 100%</p>
                            </div>
                        </div>
                        <div className="flex gap-4">
                            <div className="text-right hidden sm:block">
                                <p className="text-[10px] text-slate-500 font-bold uppercase tracking-widest">系統概況</p>
                                <div className="flex gap-3 mt-1">
                                    <div className="text-xs font-bold text-red-500">{analysisData.stats.highRisk || 0} 高危對象</div>
                                    <div className="text-xs font-bold text-blue-400">平均風險 {analysisData.stats.avgThreat || 0}%</div>
                                </div>
                            </div>
                            <button onClick={performAnalysis} className="px-6 py-2.5 bg-red-600 hover:bg-red-500 text-white rounded-xl font-bold shadow-lg shadow-red-900/40 transition transform active:scale-95 flex items-center gap-2 text-sm">
                                <i data-lucide="zap" className="w-4 h-4"></i>
                                {isAnalyzing ? "正在處理情資..." : "啟動全景掃描"}
                            </button>
                        </div>
                    </header>

                    {/* Dashboard Layout */}
                    <div className="flex-1 grid grid-cols-1 lg:grid-cols-12 gap-4 overflow-hidden">
                        
                        {/* LEFT: Input (3 cols) */}
                        <div className="lg:col-span-3 flex flex-col overflow-hidden">
                            <div className="glass-panel rounded-2xl p-5 flex-1 flex flex-col">
                                <h2 className="font-bold flex items-center gap-2 mb-3 text-slate-400 text-xs uppercase"><i data-lucide="file-text" className="text-blue-500 w-3 h-3"></i> 情資來源</h2>
                                <textarea
                                    value={inputText}
                                    onChange={(e) => setInputText(e.target.value)}
                                    className="flex-1 w-full bg-slate-950/50 border border-white/5 rounded-xl p-4 text-sm focus:ring-1 focus:ring-red-600 outline-none transition resize-none placeholder-slate-800 font-mono custom-scrollbar"
                                    placeholder="貼上以前或現在的可疑留言內容..."
                                />
                                <div className="mt-3 flex justify-between items-center">
                                    <button onClick={() => setInputText('')} className="text-[10px] text-slate-500 hover:text-red-400 flex items-center gap-1"><i data-lucide="trash-2" className="w-3 h-3"></i> 清除</button>
                                    <span className="text-[10px] text-slate-700 font-mono tracking-widest italic font-bold">DATA_INPUT_READY</span>
                                </div>
                            </div>
                        </div>

                        {/* MIDDLE: Top 50 Report (4 cols) */}
                        <div className="lg:col-span-4 glass-panel rounded-2xl flex flex-col overflow-hidden">
                            <div className="p-4 border-b border-white/5 flex justify-between items-center bg-slate-900/40">
                                <h2 className="font-bold flex items-center gap-2 text-slate-400 text-xs uppercase"><i data-lucide="table" className="text-red-500 w-3 h-3"></i> 高風險關鍵字 (Top 50)</h2>
                                <span className="bg-red-900/30 text-red-400 text-[9px] px-2 py-0.5 rounded border border-red-500/20 font-bold uppercase tracking-widest">Live Alert</span>
                            </div>
                            <div className="flex-1 overflow-y-auto custom-scrollbar">
                                <table className="w-full text-left text-[11px]">
                                    <thead className="text-slate-500 sticky top-0 bg-slate-900/95 z-10 shadow">
                                        <tr>
                                            <th className="px-4 py-3 font-bold border-b border-white/5">關鍵詞</th>
                                            <th className="px-4 py-3 font-bold border-b border-white/5">屬性分類</th>
                                            <th className="px-4 py-3 font-bold border-b border-white/5 text-right">威脅權重</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-white/5">
                                        {analysisData.words.length > 0 ? (
                                            analysisData.words.slice(0, 50).map((word, idx) => (
                                                <tr key={idx} className="risk-row transition duration-75">
                                                    <td className="px-4 py-3 flex items-center gap-2">
                                                        <span className="text-slate-700 font-mono text-[9px] w-4">{idx+1}</span>
                                                        <span className={`font-bold ${word.sentiment >= 95 ? "text-red-400" : "text-slate-300"}`}>{word.text}</span>
                                                        {word.count > 1 && <span className="text-blue-500/60 text-[9px]">({word.count})</span>}
                                                    </td>
                                                    <td className="px-4 py-3">
                                                        <span className={`px-2 py-0.5 rounded text-[9px] font-bold border ${
                                                            word.category.includes('行動') ? 'bg-red-900/20 text-red-400 border-red-500/20' :
                                                            word.category.includes('目標') ? 'bg-emerald-900/20 text-emerald-400 border-emerald-500/20' :
                                                            word.category.includes('嫌疑') ? 'bg-indigo-900/20 text-indigo-400 border-indigo-500/20' : 'bg-slate-800 text-slate-500 border-white/5'
                                                        }`}>
                                                            {word.category}
                                                        </span>
                                                    </td>
                                                    <td className="px-4 py-3 text-right">
                                                        <div className="flex items-center justify-end gap-2">
                                                            <span className={`font-mono font-bold text-[10px] ${word.sentiment >= 95 ? "text-red-500" : "text-slate-400"}`}>{word.sentiment}%</span>
                                                        </div>
                                                    </td>
                                                </tr>
                                            ))
                                        ) : (
                                            <tr><td colSpan="3" className="py-40 text-center text-slate-700 italic text-xs tracking-widest font-bold">READY FOR INTELLIGENCE SCAN</td></tr>
                                        )}
                                    </tbody>
                                </table>
                            </div>
                        </div>

                        {/* RIGHT: Visuals (5 cols) */}
                        <div className="lg:col-span-5 flex flex-col gap-4 overflow-hidden">
                            <div className="glass-panel rounded-2xl p-5 flex-1 flex flex-col overflow-hidden shadow-2xl">
                                <h2 className="font-bold flex items-center gap-2 mb-2 text-slate-400 text-xs uppercase"><i data-lucide="cloud" className="text-blue-500 w-3 h-3"></i> 特徵語義分佈</h2>
                                <div className="flex-1 flex items-center justify-center relative">
                                    <canvas ref={cloudCanvasRef} className="max-w-full max-h-full"></canvas>
                                </div>
                            </div>
                            <div className="glass-panel rounded-2xl p-5 flex-[1.5] flex flex-col overflow-hidden shadow-2xl">
                                <h2 className="font-bold flex items-center gap-2 mb-2 text-slate-400 text-xs uppercase"><i data-lucide="share-2" className="text-indigo-400 w-3 h-3"></i> 情資拓撲關聯</h2>
                                <div ref={networkRef} className="flex-1 bg-slate-950/30 rounded-xl border border-white/5"></div>
                            </div>
                        </div>
                    </div>

                    {/* Footer Stats & Info */}
                    <div className="flex-none grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div className="bg-red-950/20 border border-red-500/20 px-4 py-3 rounded-xl flex items-center gap-3">
                            <i data-lucide="alert-circle" className="w-4 h-4 text-red-500"></i>
                            <p className="text-[10px] text-slate-400">已自動標記歷史威脅對象（如：唐澤貴洋、粘孝帆）與特定的炸彈類型（C4、塑膠炸彈）為最高風險級別。</p>
                        </div>
                        <div className="bg-emerald-950/20 border border-emerald-500/20 px-4 py-3 rounded-xl flex items-center gap-3">
                            <i data-lucide="map-pin" className="w-4 h-4 text-emerald-500"></i>
                            <p className="text-[10px] text-slate-400">目標場所已涵蓋台中歌劇院、科博館、機場、及大專院校考場等歷史受脅熱點。</p>
                        </div>
                        <div className="bg-slate-900/50 border border-white/5 px-4 py-3 rounded-xl flex items-center justify-between">
                            <span className="text-[10px] text-slate-500 font-mono">STATUS: SCANNING_ACTIVE</span>
                            <div className="flex items-center gap-2">
                                <span className="h-1.5 w-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
                                <span className="text-[9px] text-emerald-500 font-bold">SYSTEM_OK</span>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
        setTimeout(() => { if(window.lucide) window.lucide.createIcons(); }, 150);
    </script>
</body>
</html>
