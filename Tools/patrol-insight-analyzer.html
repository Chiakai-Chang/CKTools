<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>網路巡邏情資分析系統 v4.2</title>
    <!-- 預先載入外部資源 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/wordcloud2.js/1.2.2/wordcloud2.min.js"></script>
    <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #020617; color: #f1f5f9; margin: 0; padding: 0; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; height: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        .glass-panel { background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .risk-row:hover { background: rgba(239, 68, 68, 0.1); transition: background 0.15s ease; }
        .canvas-viewport { overflow: auto; background: rgba(0, 0, 0, 0.2); border-radius: 1rem; position: relative; }
        .canvas-container { min-width: 1600px; height: 400px; transition: transform 0.2s ease-out; transform-origin: left top; }
        .modal-overlay { background: rgba(2, 6, 23, 0.95); backdrop-filter: blur(15px); }
        canvas { user-select: none; }
        .zoom-controls { position: absolute; top: 1rem; right: 1rem; z-index: 10; display: flex; gap: 0.5rem; }
        
        /* 下拉選單樣式優化 */
        select {
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='white' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 0.5rem center;
            background-size: 1em;
        }

        @keyframes blink-red {
            0%, 100% { color: #f87171; opacity: 1; }
            50% { color: #ef4444; opacity: 0.7; }
        }
        .suspect-highlight {
            color: #ff4d4d !important;
            animation: blink-red 1.5s infinite;
            text-shadow: 0 0 10px rgba(255, 77, 77, 0.4);
        }
    </style>
</head>
<body class="overflow-hidden">
    <div id="root">
        <div class="h-screen w-screen flex flex-col items-center justify-center bg-[#020617] space-y-6">
            <div class="relative">
                <div class="w-16 h-16 border-4 border-blue-500/20 rounded-full"></div>
                <div class="absolute top-0 w-16 h-16 border-4 border-blue-500 border-t-transparent rounded-full animate-spin"></div>
            </div>
            <div class="text-center">
                <p class="text-blue-500 font-bold tracking-[0.2em] text-lg uppercase mb-2">Intelligence Engine</p>
                <p class="text-slate-600 text-sm animate-pulse">正在優化分類篩選器與犯罪嫌疑人字典...</p>
            </div>
        </div>
    </div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        // --- 高危犯罪嫌疑人清單 (紅色標註) ---
        const SUSPECTS = new Set([
          '張文', '唐澤貴洋', '鄭捷', '張海川', '吳明璋', '粘孝帆', '蔡傑宏', 
          '蕭清淵', '余福明', '賴志忠', 'Karasawa Takahiro', 'Karasawa', 'Takahiro'
        ]);

        // --- 核心威脅特徵字典 (依據附件與最新需求精準修訂) ---
        const THREAT_SINGLE_CHARS = new Set(['砍', '炸', '殺', '死', '槍', '彈', '刀', '血', '恨', '仇', '爆', '捅', '刺', '斬', '捅刺', '割喉']);
        const CORE_DICT = [
            // 人物關係與宣告
            '我兄弟', '我小弟', '我的人', '我朋友', '張文同夥', '一個組織', '這群人', '同夥表示', '我們組織',
            '張文', '鄭捷', '吳明璋', '唐澤貴洋', '粘孝帆', '蔡傑宏', '蕭清淵', '余福明', '賴志忠', '張海川', '萊爾校長', 'Karasawa Takahiro',
            // 名人與政治人物 (擴充)
            '賴清德', '盧秀燕', '顏寬恆', '蔡英文', '柯文哲', '韓國瑜', '蕭美琴', '陳其邁', '蔣萬安', '朱立倫', '侯友宜', '黃珊珊', '徐巧芯', '苗博雅', '王定宇', '國民黨員', '民進黨員', '國民黨', '民進黨', '民眾黨',
            // 語義導航
            '下一站', '敬請期待',
            // 地點實體 (精準匹配附件)
            '北捷事件', '中山捷運站', '高雄車站', '台北車站', '台中車站', '小港機場', '台中新光三越', '新光三越', 
            '台中秀泰', '豐原愛買', '中山誠品', '板南線', '市政府站', '高雄中央公園', '東海大學', '鳳山行動',
            '馬公基地', '台北101', '日曜天地', '太平洋百貨', '大雅國中', '親親影城', '台中市政府', '學士路', '四維國小',
            // 行動與武器
            '恐怖攻擊', '隨機殺人', '丟煙霧彈', '完成任務', '未完成的任務', '土製炸彈', '手榴彈', '汽油彈', 
            '塑膠炸彈', '定時炸彈', '遙控炸彈', '爆裂物', '開山刀', '燃燒瓶', '硝酸銨', 'TNT', 'C4', '氯酸鉀', '匕首',
            // 組織與背景
            '第五縱隊', '中國上海', '武警', '上海當武警', '中國解放軍', '共青團', '軍旅生活', '黑色豪門企業', '黑社會',
            '國有器官', '神韻演出', '直播中', 'Youtube直播', 'Facebook直播', 'TikTok直播', '社會毒瘤', '共體時艱'
        ];

        const SENTIMENT_MAP = {
            '隨機殺人': 100, '恐怖攻擊': 100, '炸死': 100, '砍死': 100, '射殺人群': 100, '割喉': 100, '捅刺': 100,
            '塑膠炸彈': 100, '定時炸彈': 100, '遙控炸彈': 100, '爆裂物': 100, 'C4': 100, '手槍': 100, '土製炸彈': 100,
            '燃燒瓶': 100, '炸': 100, '殺': 100, '砍': 100, '槍': 100, '彈': 100, '死': 100, '匕首': 100,
            '我兄弟': 95, '我小弟': 95, '張文': 100, '鄭捷': 100, '唐澤貴洋': 100, '張海川': 100,
            '引爆': 98, '放置炸彈': 98, '12月25日': 95, '12月31日': 95,
            '歌劇院': 92, '科博館': 92, '機場': 95, '直播': 85
        };

        const STOP_WORDS = new Set(['的', '了', '在', '我', '你', '他', '她', '們', '是', '一個', '也才', '也是', '這部', '這個', '就是', '因為', '所以', '但是', '我們', '今天', '已經', '真的', '什麼', '大家', '學會', '起來', '現在', '還是', '內容', '請問', '怎麼', '知道', '指示', '原本', '計劃', '表示', '需要', '可能', '長期', '如果', '結果', '準備', '事件', '哈哈', '那些', '這些', '一些', '一點', '一樣', '一下', '你好', '先生', '本人', '大家', '恭喜', '期待']);

        const App = () => {
            const [inputText, setInputText] = useState('');
            const [analysisData, setAnalysisData] = useState({ words: [], edges: [], stats: {} });
            const [isAnalyzing, setIsAnalyzing] = useState(false);
            const [showAbout, setShowAbout] = useState(false);
            const [zoom, setZoom] = useState(1);
            const [filter, setFilter] = useState('全部');
            
            const cloudCanvasRef = useRef(null);
            const networkRef = useRef(null);
            const networkInstance = useRef(null);

            const getCategory = (word) => {
                if (['殺', '炸', '砍', '射', '死', '彈', '槍', '刀', '手雷', 'C4', '爆', '割喉', '燃燒', '硝酸銨', '匕首', '武器'].some(k => word.includes(k))) return '行動/武器';
                if (['車站', '捷運', '板南', '商場', '新光', '秀泰', '歌劇院', '科博館', '影城', '機場', '101', '大學', '誠品', '公園', '考場', '路', '站'].some(k => word.includes(k))) return '目標場所';
                if (['兄弟', '小弟', '同夥', '組織', '張文', '鄭捷', '吳明璋', '武警', '解放軍', '貴洋', '張海川', '粘孝帆', '蔡傑宏', '共青團', 'Karasawa'].some(k => word.includes(k))) return '群體/身分';
                if (['賴清德', '盧秀燕', '顏寬恆', '蔡英文', '柯文哲', '韓國瑜', '蕭美琴', '陳其邁', '蔣萬安', '朱立倫', '侯友宜', '黃珊珊', '徐巧芯', '苗博雅', '國民黨', '民進黨', '民眾黨'].some(k => word.includes(k))) return '政治人物/組織';
                if (/[A-Z]\d{9}/.test(word) || word.startsWith('bc1q')) return '識別特徵 (ID/BTC)';
                return '一般性言論';
            };

            const tokenize = (text) => {
                let tokens = [];
                try {
                    // 偵測 ID 與 BTC 錢包
                    const idRegex = /([A-Z]\d{9})/g;
                    const btcRegex = /(bc1q[a-zA-Z0-9]{38,58})/g;
                    let tempText = text;
                    let match;
                    while ((match = idRegex.exec(text)) !== null) { tokens.push(match[0]); tempText = tempText.replace(match[0], ' '.repeat(match[0].length)); }
                    while ((match = btcRegex.exec(text)) !== null) { tokens.push(match[0]); tempText = tempText.replace(match[0], ' '.repeat(match[0].length)); }
                    
                    const dateRegex = /(\d{1,2}月\d{1,2}日)/g;
                    while ((match = dateRegex.exec(tempText)) !== null) {
                        tokens.push(match[0]);
                        tempText = tempText.replace(match[0], ' '.repeat(match[0].length));
                    }

                    const clean = tempText.replace(/[^\u4e00-\u9fa5a-zA-Z0-9]/g, ' ');
                    const segs = clean.split(/\s+/);
                    segs.forEach(seg => {
                        let i = 0;
                        while (i < seg.length) {
                            let matched = false;
                            const sortedDict = [...CORE_DICT].sort((a, b) => b.length - a.length);
                            for (const word of sortedDict) {
                                if (seg.substring(i, i + word.length) === word) {
                                    tokens.push(word);
                                    i += word.length;
                                    matched = true;
                                    break;
                                }
                            }
                            if (!matched) {
                                let char = seg[i];
                                if (THREAT_SINGLE_CHARS.has(char)) {
                                    tokens.push(char);
                                } else if (i + 1 < seg.length) {
                                    let bi = seg.substring(i, i + 2);
                                    if (!STOP_WORDS.has(bi) && !/[\d]/.test(bi)) tokens.push(bi);
                                }
                                i++;
                            }
                        }
                    });
                } catch (e) { console.error(e); }
                return tokens.filter(t => t.length > 1 || THREAT_SINGLE_CHARS.has(t));
            };

            const performAnalysis = () => {
                if (!inputText.trim()) return;
                setIsAnalyzing(true);
                setTimeout(() => {
                    try {
                        const lines = inputText.split(/\n/).filter(l => l.trim().length > 0);
                        const wordFreq = {};
                        const coOccurrence = {};
                        lines.forEach(line => {
                            const tokens = tokenize(line);
                            const uniqueTokens = [...new Set(tokens)];
                            tokens.forEach(t => { wordFreq[t] = (wordFreq[t] || 0) + 1; });
                            for (let i = 0; i < uniqueTokens.length; i++) {
                                for (let j = i + 1; j < uniqueTokens.length; j++) {
                                    const pair = [uniqueTokens[i], uniqueTokens[j]].sort().join('::');
                                    coOccurrence[pair] = (coOccurrence[pair] || 0) + 1;
                                }
                            }
                        });
                        const sortedWords = Object.entries(wordFreq)
                            .sort((a, b) => b[1] - a[1])
                            .map(([text, count]) => ({
                                text,
                                count,
                                sentiment: SENTIMENT_MAP[text] || Math.min(65 + count * 2, 85),
                                category: getCategory(text)
                            }));
                        setAnalysisData({
                            words: sortedWords,
                            edges: Object.entries(coOccurrence).map(([id, weight]) => ({ id, weight })),
                            stats: {
                                totalWords: sortedWords.length,
                                highRisk: sortedWords.filter(w => (SENTIMENT_MAP[w.text] || 0) >= 95 || SUSPECTS.has(w.text)).length,
                                avgThreat: Math.round(sortedWords.reduce((acc, curr) => acc + (SENTIMENT_MAP[curr.text] || 65), 0) / (sortedWords.length || 1))
                            }
                        });
                    } catch (err) { console.error(err); } finally { setIsAnalyzing(false); }
                }, 100);
            };

            const downloadCanvas = (canvasRef, fileName) => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const link = document.createElement('a');
                link.download = fileName;
                link.href = canvas.toDataURL('image/png');
                link.click();
            };

            // 過濾後的高風險清單
            const filteredWords = useMemo(() => {
                if (filter === '全部') return analysisData.words.slice(0, 50);
                return analysisData.words.filter(w => w.category === filter).slice(0, 50);
            }, [analysisData.words, filter]);

            useEffect(() => {
                if (analysisData.words.length > 0) {
                    if (cloudCanvasRef.current && window.WordCloud) {
                        const canvas = cloudCanvasRef.current;
                        canvas.width = 1800; 
                        canvas.height = 400;
                        window.WordCloud(canvas, {
                            list: analysisData.words.slice(0, 200).map(w => [w.text, Math.sqrt(w.count) * 25 + 8]),
                            fontFamily: 'Noto Sans TC',
                            color: (w) => (SUSPECTS.has(w) || SENTIMENT_MAP[w] >= 95 || THREAT_SINGLE_CHARS.has(w)) ? '#ef4444' : '#60a5fa',
                            rotateRatio: 0,
                            backgroundColor: 'transparent',
                            gridSize: 8,
                            weightFactor: 1.5
                        });
                    }
                    if (networkRef.current && window.vis) {
                        const topWords = analysisData.words.slice(0, 50);
                        const nodes = topWords.map(w => ({
                            id: w.text, label: w.text, shape: 'box', margin: 10,
                            font: { size: 16 + (w.count / (analysisData.words[0]?.count || 1)) * 25, color: '#fff', face: 'Noto Sans TC' },
                            color: { 
                                background: SUSPECTS.has(w.text) || w.sentiment >= 95 ? '#7f1d1d' : '#1e3a8a', 
                                border: SUSPECTS.has(w.text) || w.sentiment >= 95 ? '#ef4444' : '#3b82f6' 
                            }
                        }));
                        const edges = analysisData.edges
                            .filter(e => {
                                const [s, t] = e.id.split('::');
                                return topWords.some(w => w.text === s) && topWords.some(w => w.text === t);
                            })
                            .map(e => ({ from: e.id.split('::')[0], to: e.id.split('::')[1], width: Math.sqrt(e.weight) * 3, color: 'rgba(148, 163, 184, 0.3)', length: 300 }));
                        if (networkInstance.current) networkInstance.current.destroy();
                        networkInstance.current = new window.vis.Network(networkRef.current, { nodes, edges }, {
                            physics: { solver: 'forceAtlas2Based', forceAtlas2Based: { gravitationalConstant: -150, avoidOverlap: 1 } },
                            interaction: { hover: true, zoomView: true, dragNodes: true }
                        });
                    }
                }
            }, [analysisData]);

            useEffect(() => { if (window.lucide) window.lucide.createIcons(); });

            return (
                <div className="h-screen flex flex-col p-4 lg:p-6 space-y-4 bg-[#020617] overflow-hidden">
                    <header className="flex-none flex flex-col md:flex-row justify-between items-center gap-4 bg-slate-900/40 p-5 rounded-3xl border border-white/5 shadow-2xl backdrop-blur-xl">
                        <div className="flex items-center gap-4">
                            <div className="bg-red-600 p-2.5 rounded-2xl shadow-lg">
                                <i data-lucide="shield-alert" className="w-6 h-6 text-white"></i>
                            </div>
                            <div>
                                <h1 className="text-xl font-bold text-white tracking-tight">網路巡邏情資分析系統</h1>
                                <p className="text-slate-500 text-[10px] uppercase tracking-widest font-black opacity-70">Methodology v4.2 | Filter & Suspect Focus</p>
                            </div>
                        </div>
                        <div className="flex gap-3">
                            <button onClick={() => setShowAbout(true)} className="px-4 py-2 bg-slate-800/80 hover:bg-slate-700 text-slate-300 rounded-2xl text-[11px] font-bold border border-white/10 transition-all flex items-center gap-2">
                                <i data-lucide="help-circle" className="w-4 h-4 text-blue-400"></i> 分析說明
                            </button>
                            <button onClick={performAnalysis} disabled={isAnalyzing} className="px-8 py-2.5 bg-red-600 hover:bg-red-500 text-white rounded-2xl font-bold shadow-xl transition transform active:scale-95 flex items-center gap-2 text-sm disabled:opacity-50">
                                <i data-lucide="zap" className={`w-4 h-4 ${isAnalyzing ? 'animate-pulse' : ''}`}></i>啟動全景分析
                            </button>
                        </div>
                    </header>

                    {showAbout && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 modal-overlay">
                            <div className="glass-panel max-w-3xl w-full max-h-[90vh] rounded-[2.5rem] p-10 flex flex-col overflow-hidden border border-white/10 shadow-2xl text-slate-300">
                                <div className="flex justify-between items-center mb-8 border-b border-white/5 pb-6">
                                    <h3 className="text-2xl font-bold text-blue-400">v4.2 語義與功能更新</h3>
                                    <button onClick={() => setShowAbout(false)} className="p-2 hover:bg-white/5 rounded-full text-slate-500"><i data-lucide="x" className="w-8 h-8"></i></button>
                                </div>
                                <div className="flex-1 overflow-y-auto custom-scrollbar space-y-6 text-sm">
                                    <section className="bg-slate-950/50 p-6 rounded-3xl border border-white/5">
                                        <h4 className="font-bold text-white mb-3 flex items-center gap-2 border-l-4 border-blue-500 pl-3">嫌疑人與政治人物庫擴充</h4>
                                        <p>系統目前已內建 30+ 位高危嫌疑人與當政政治人物字典，包含賴清德、盧秀燕、張文、鄭捷、唐澤貴洋等，並針對犯嫌強制紅字預警。</p>
                                    </section>
                                    <section className="bg-slate-950/50 p-6 rounded-3xl border border-white/5">
                                        <h4 className="font-bold text-white mb-3 flex items-center gap-2 border-l-4 border-emerald-500 pl-3">識別特徵碼自動分類</h4>
                                        <p>新增正則表達式偵測，自動識別並分類「身分證字號」與「比特幣 (BTC) 錢包地址」，強化對恐嚇勒索內容的情資提取能力。</p>
                                    </section>
                                </div>
                                <div className="mt-8 text-center"><button onClick={() => setShowAbout(false)} className="px-16 py-3 bg-blue-600 hover:bg-blue-500 text-white rounded-2xl font-bold transition shadow-xl">確認</button></div>
                            </div>
                        </div>
                    )}

                    <div className="flex-1 grid grid-cols-1 lg:grid-cols-12 gap-5 overflow-hidden">
                        <div className="lg:col-span-3 flex flex-col overflow-hidden">
                            <div className="glass-panel rounded-3xl p-6 flex-1 flex flex-col shadow-xl">
                                <h2 className="font-bold flex items-center gap-2 mb-4 text-slate-400 text-xs uppercase tracking-widest"><i data-lucide="file-text" className="text-blue-500 w-3 h-3"></i> 情資來源內容</h2>
                                <textarea value={inputText} onChange={(e) => setInputText(e.target.value)} className="flex-1 w-full bg-slate-950/40 border border-white/5 rounded-2xl p-5 text-[13px] text-slate-300 focus:ring-1 focus:ring-red-600 outline-none transition resize-none placeholder-slate-800 font-mono custom-scrollbar leading-relaxed" placeholder="在此處貼上社群留言、電郵或其他可疑文本..."/>
                            </div>
                        </div>

                        <div className="lg:col-span-3 glass-panel rounded-3xl flex flex-col overflow-hidden shadow-xl">
                            <div className="p-5 border-b border-white/5 space-y-3 bg-slate-900/40">
                                <h2 className="font-bold flex items-center gap-2 text-slate-400 text-xs uppercase tracking-widest"><i data-lucide="table" className="text-red-500 w-3 h-3"></i> 風險排行 (Top 50)</h2>
                                <div className="relative">
                                    <select 
                                        value={filter} 
                                        onChange={(e) => setFilter(e.target.value)}
                                        className="w-full bg-slate-800 border border-white/10 rounded-xl px-3 py-1.5 text-[11px] text-slate-200 focus:ring-1 focus:ring-blue-500 outline-none transition cursor-pointer"
                                    >
                                        <option value="全部">所有類別 (全部)</option>
                                        <option value="群體/身分">群體/身分 (人物)</option>
                                        <option value="行動/武器">行動/武器 (脅迫)</option>
                                        <option value="目標場所">目標場所 (地點)</option>
                                        <option value="政治人物/組織">政治人物/組織</option>
                                        <option value="識別特徵 (ID/BTC)">識別特徵 (ID/BTC)</option>
                                        <option value="一般性言論">一般性言論</option>
                                    </select>
                                </div>
                            </div>
                            <div className="flex-1 overflow-y-auto custom-scrollbar">
                                <table className="w-full text-left text-[11px]">
                                    <thead className="text-slate-500 sticky top-0 bg-[#0c1322] z-10">
                                        <tr><th className="px-4 py-4 font-bold border-b border-white/5">情資關鍵字</th><th className="px-4 py-4 font-bold border-b border-white/5 text-right">權重</th></tr>
                                    </thead>
                                    <tbody className="divide-y divide-white/5">
                                        {filteredWords.map((word, idx) => (
                                            <tr key={idx} className="risk-row transition">
                                                <td className="px-4 py-3.5">
                                                    <div className="flex items-center gap-2">
                                                        <span className="text-slate-800 font-mono text-[9px] w-4">{idx+1}</span>
                                                        <span className={`font-bold tracking-tight ${SUSPECTS.has(word.text) ? "suspect-highlight" : (word.sentiment >= 95 ? "text-red-400" : "text-slate-300")}`}>
                                                            {word.text}
                                                        </span>
                                                        {SUSPECTS.has(word.text) && <i data-lucide="alert-circle" className="w-3 h-3 text-red-500 animate-pulse"></i>}
                                                    </div>
                                                    <span className="text-[9px] text-slate-600 ml-6 block">{word.category}</span>
                                                </td>
                                                <td className="px-4 py-3.5 text-right font-mono font-bold text-xs"><span className={word.sentiment >= 95 ? "text-red-500" : "text-slate-500"}>{word.sentiment}%</span></td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                                {!analysisData.words.length && <div className="py-48 text-center text-slate-800 italic text-[10px] font-black uppercase tracking-[0.2em] opacity-40">Ready for Scan</div>}
                            </div>
                        </div>

                        <div className="lg:col-span-6 flex flex-col gap-5 overflow-hidden">
                            <div className="glass-panel rounded-3xl p-6 h-[43%] flex flex-col overflow-hidden shadow-2xl relative">
                                <div className="flex justify-between items-center mb-3 border-b border-white/5 pb-3">
                                    <h2 className="font-bold flex items-center gap-2 text-slate-400 text-xs uppercase tracking-widest"><i data-lucide="cloud" className="text-blue-500 w-3 h-3"></i> 特徵語義全景圖</h2>
                                    <div className="flex items-center gap-3">
                                        <div className="flex items-center bg-slate-800 px-3 py-1 rounded-xl gap-2 border border-white/5">
                                            <i data-lucide="zoom-in" className="w-3 h-3 text-slate-500"></i>
                                            <input type="range" min="0.5" max="3" step="0.1" value={zoom} onChange={(e) => setZoom(parseFloat(e.target.value))} className="w-20 h-1 accent-blue-500"/>
                                            <span className="text-[10px] font-mono text-blue-400">{Math.round(zoom*100)}%</span>
                                        </div>
                                        <button onClick={() => setZoom(1)} className="text-[9px] text-slate-500 hover:text-white uppercase font-bold transition">Reset</button>
                                        <button onClick={() => downloadCanvas(cloudCanvasRef, 'word_cloud_v42.png')} className="text-[10px] bg-slate-800 hover:bg-slate-700 text-slate-400 px-3 py-1.5 rounded-xl flex items-center gap-1.5 transition-all"><i data-lucide="download" className="w-3 h-3"></i> 導出</button>
                                    </div>
                                </div>
                                <div className="flex-1 canvas-viewport custom-scrollbar relative">
                                    <div className="canvas-container" style={{ transform: `scale(${zoom})` }}>
                                        <canvas ref={cloudCanvasRef}></canvas>
                                    </div>
                                    {!analysisData.words.length && <div className="absolute inset-0 flex items-center justify-center text-slate-900 text-[11px] font-black uppercase tracking-[0.5em] opacity-40">Awaiting Intelligence Data</div>}
                                </div>
                            </div>
                            <div className="glass-panel rounded-3xl p-6 h-[57%] flex flex-col overflow-hidden shadow-2xl relative">
                                <div className="flex justify-between items-center mb-3 border-b border-white/5 pb-3">
                                    <h2 className="font-bold flex items-center gap-2 text-slate-400 text-xs uppercase tracking-widest"><i data-lucide="share-2" className="text-indigo-400 w-3 h-3"></i> 情資拓撲關聯網絡</h2>
                                </div>
                                <div ref={networkRef} className="flex-1 bg-slate-950/40 rounded-2xl border border-white/5"></div>
                            </div>
                        </div>
                    </div>

                    <footer className="flex-none grid grid-cols-1 md:grid-cols-3 gap-5">
                        <div className="bg-red-950/10 border border-red-500/10 px-5 py-3 rounded-2xl flex items-center gap-4">
                            <i data-lucide="users" className="w-4 h-4 text-red-600"></i>
                            <p className="text-[10px] text-slate-500 font-bold leading-relaxed uppercase tracking-tight font-sans">重點犯嫌警示：張文、唐澤貴洋、張海川等已標註閃爍紅字預警。</p>
                        </div>
                        <div className="bg-blue-950/10 border border-blue-500/10 px-5 py-3 rounded-2xl flex items-center gap-4">
                            <i data-lucide="user-check" className="w-4 h-4 text-blue-600"></i>
                            <p className="text-[10px] text-slate-500 font-bold leading-relaxed uppercase tracking-tight font-sans">實體識別：賴清德、盧秀燕、蔡英文等及身分證/BTC已正確分類。</p>
                        </div>
                        <div className="bg-slate-900/40 border border-white/5 px-5 py-3 rounded-2xl flex items-center justify-between">
                            <span className="text-[10px] text-slate-700 font-black tracking-widest font-mono uppercase">Version 4.2 Intelligence Suite</span>
                            <div className="flex items-center gap-2.5"><div className="h-2 w-2 rounded-full bg-emerald-500 shadow-[0_0_12px_#10b981] animate-pulse"></div><span className="text-[10px] text-emerald-500 font-black uppercase tracking-tighter">Ready</span></div>
                        </div>
                    </footer>
                </div>
            );
        };

        const mount = () => {
            const container = document.getElementById('root');
            if (container && typeof ReactDOM !== 'undefined') {
                const root = ReactDOM.createRoot(container);
                root.render(<App />);
            } else { setTimeout(mount, 50); }
        };
        mount();
    </script>
</body>
</html>
