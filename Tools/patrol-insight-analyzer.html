                if ([
                    '賴清德', '蔡英文', '柯文哲', '韓國瑜', '沈伯洋', '黃國昌', '徐巧芯', '王世堅', 
                    '盧秀燕', '蔣萬安', '陳其邁', '郭台銘', '馬英九', '阿扁', '蘇貞昌', '蕭美琴',
                    '國民黨', '民進黨', '民眾黨', '塔綠班', '青鳥', '小草', '白共', '綠營', '藍營',
                    '賴神', '小英', '阿北', '韓總', 'Puma', '蔥哥', '恰吉', '花蓮王', 'EE', '功德'
                ].some(k => word.includes(k))) return '政治人物/暱稱';
            
                // 6. 識別特徵碼：身分證字號或加密貨幣錢包地址
                if (/[A-Z]\d{9}/.test(word) || word.startsWith('bc1q') || word.includes('IP')) return '識別特徵碼';
            
                // 7. 一般性言論
                return '一般性言論';
            };

            const getRiskLevel = (score) => {
                if (score >= 95) return '極高危';
                if (score >= 85) return '高風險';
                if (score >= 75) return '中風險';
                return '低風險';
            };

            const getRiskColor = (score) => {
                if (score >= 95) return 'bg-red-600 text-white border-red-400';
                if (score >= 85) return 'bg-orange-600 text-white border-orange-400';
                if (score >= 75) return 'bg-yellow-600 text-black border-yellow-400';
                return 'bg-slate-700 text-slate-300 border-slate-500';
            };

            const handleDragOver = (e) => { e.preventDefault(); setIsDragging(true); };
            const handleDragLeave = () => setIsDragging(false);
            const handleDrop = (e) => {
                e.preventDefault(); setIsDragging(false);
                const file = e.dataTransfer.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (event) => setInputText(event.target.result);
                    reader.readAsText(file);
                }
            };

            const precisionTokenize = (text) => {
                let tokens = [];
                try {
                    const clean = text.replace(/[^\u4e00-\u9fa5a-zA-Z0-9]/g, ' ');
                    const segs = clean.split(/\s+/);
                    segs.forEach(seg => {
                        let i = 0;
                        while (i < seg.length) {
                            let matched = false;
                            const sortedDict = [...CORE_DICT].sort((a, b) => b.length - a.length);
                            for (const word of sortedDict) {
                                if (seg.substring(i, i + word.length) === word) {
                                    tokens.push(word);
                                    i += word.length; 
                                    matched = true;
                                    break;
                                }
                            }
                            if (!matched) {
                                if (i + 1 < seg.length) {
                                    let bi = seg.substring(i, i + 2);
                                    if (!STOP_WORDS.has(bi) && !/[\d]/.test(bi)) {
                                        tokens.push(bi);
                                        i += 2; 
                                    } else { i++; }
                                } else { i++; }
                            }
                        }
                    });
                } catch (e) { console.error(e); }
                return tokens.filter(t => t.length > 1 || ['砍', '炸', '殺', '死'].includes(t));
            };

            const performAnalysis = () => {
                if (!inputText.trim()) return;
                setIsAnalyzing(true);
                setTimeout(() => {
                    const lines = inputText.split(/\n/).filter(l => l.trim().length > 0);
                    const wordFreq = {};
                    const coOccurrence = {};
                    lines.forEach(line => {
                        const tokens = precisionTokenize(line);
                        const uniqueTokens = [...new Set(tokens)];
                        tokens.forEach(t => { wordFreq[t] = (wordFreq[t] || 0) + 1; });
                        for (let i = 0; i < uniqueTokens.length; i++) {
                            for (let j = i + 1; j < uniqueTokens.length; j++) {
                                const pair = [uniqueTokens[i], uniqueTokens[j]].sort().join('::');
                                coOccurrence[pair] = (coOccurrence[pair] || 0) + 1;
                            }
                        }
                    });
                    const sortedWords = Object.entries(wordFreq).sort((a, b) => b[1] - a[1]).map(([text, count]) => {
                        const baseScore = SENTIMENT_MAP[text] || Math.min(65 + count * 2, 85);
                        return { text, count, sentiment: baseScore, category: getCategory(text) };
                    });
                    setAnalysisData({ words: sortedWords, edges: Object.entries(coOccurrence).map(([id, weight]) => ({ id, weight })) });
                    setIsAnalyzing(false);
                    setZoom(1);
                }, 300);
            };

            const filteredWords = useMemo(() => {
                let list = analysisData.words || [];
                if (categoryFilter !== '全部') list = list.filter(w => w.category === categoryFilter);
                if (selectedRisks.length > 0) {
                    list = list.filter(w => selectedRisks.includes(getRiskLevel(SUSPECTS.has(w.text) ? 100 : w.sentiment)));
                }
                return list;
            }, [analysisData.words, categoryFilter, selectedRisks]);

            const toggleRiskFilter = (label) => {
                setSelectedRisks(prev => prev.includes(label) ? prev.filter(r => r !== label) : [...prev, label]);
            };

            // --- 繪圖邏輯：全量拓樸優化 ---
            useEffect(() => {
                if (analysisData.words.length > 0) {
                    if (cloudCanvasRef.current && window.WordCloud) {
                        const canvas = cloudCanvasRef.current;
                        const container = viewportRef.current;
                        canvas.width = container.clientWidth;
                        canvas.height = container.clientHeight;
                        const maxCount = analysisData.words[0]?.count || 1;
                        const dynamicScale = Math.min(canvas.width / 50, (canvas.height / maxCount) * 18);
                        window.WordCloud(canvas, {
                            list: analysisData.words.slice(0, 250).map(w => [w.text, w.count]),
                            fontFamily: 'Noto Sans TC',
                            color: (w) => (SUSPECTS.has(w) || (SENTIMENT_MAP[w] || 0) >= 95) ? '#ef4444' : '#60a5fa',
                            rotateRatio: 0,
                            gridSize: 10,
                            weightFactor: (size) => Math.sqrt(size / maxCount) * dynamicScale + 5,
                            shrinkToFit: true,
                            clearCanvas: true
                        });
                    }
                    if (networkRef.current && window.vis) {
                        // 核心改進：移除 slice，全量呈現
                        // 若項目極多(>300)，考慮分層渲染，但此處依要求設為全量
                        const currentWords = filteredWords.length > 0 ? filteredWords : analysisData.words;
                        const baseCount = analysisData.words[0]?.count || 1;
                        
                        const nodes = currentWords.map(w => {
                            const isHighRisk = SUSPECTS.has(w.text) || (SENTIMENT_MAP[w.text] || 0) >= 95;
                            // 巨大化字體邏輯，但在全量顯示時稍微壓低基數防止擁擠
                            const fontSize = Math.max(26, (w.count / baseCount) * 75);
                            return {
                                id: w.text, label: w.text, shape: 'box', margin: 15,
                                font: { size: fontSize, color: '#fff', face: 'Noto Sans TC', bold: true },
                                color: { background: isHighRisk ? '#991b1b' : '#1e3a8a', border: isHighRisk ? '#ef4444' : '#3b82f6' },
                                borderWidth: isHighRisk ? 5 : 2,
                                shadow: { enabled: true, color: isHighRisk ? 'rgba(239, 68, 68, 0.6)' : 'rgba(0,0,0,0.5)', size: 15 }
                            };
                        });
                        
                        const edges = analysisData.edges.filter(e => {
                            const [s, t] = e.id.split('::');
                            return currentWords.some(w => w.text === s) && currentWords.some(w => w.text === t);
                        }).map(e => ({ 
                            from: e.id.split('::')[0], 
                            to: e.id.split('::')[1], 
                            width: Math.sqrt(e.weight) * 5, 
                            color: 'rgba(148, 163, 184, 0.4)', 
                            length: 250 
                        }));

                        if (networkInstance.current) networkInstance.current.destroy();
                        networkInstance.current = new window.vis.Network(networkRef.current, { nodes, edges }, {
                            physics: { 
                                solver: 'forceAtlas2Based', 
                                forceAtlas2Based: { 
                                    gravitationalConstant: -1800, 
                                    centralGravity: 0.08, // 強引力保持全量節點不飄走
                                    springLength: 200, 
                                    springConstant: 0.1, 
                                    avoidOverlap: 1.8 
                                },
                                stabilization: { iterations: 400, updateInterval: 50 }
                            },
                            interaction: { hover: true, zoomView: true, dragNodes: true }
                        });
                    }
                }
            }, [analysisData, filteredWords]);

            useEffect(() => { if (window.lucide) window.lucide.createIcons(); });

            return (
                <div className="app-container p-4 lg:p-6 bg-[#020617] text-slate-200 font-sans">
                    <header className="flex-none flex flex-col lg:flex-row justify-between items-center gap-4 bg-slate-900/40 p-5 rounded-3xl border border-white/5 shadow-2xl mb-6 backdrop-blur-xl">
                        <div className="flex items-center gap-4 text-center lg:text-left">
                            <div className="bg-red-600 p-2.5 rounded-2xl shadow-lg animate-pulse"><i data-lucide="shield-alert" className="w-6 h-6 text-white"></i></div>
                            <div>
                                <h1 className="text-xl lg:text-2xl font-black tracking-tight uppercase tracking-tighter">網路巡邏情資分析系統</h1>
                                <p className="text-slate-500 text-[10px] uppercase tracking-widest font-black opacity-70">v6.5 Final | Total Topology Mapping | Full Precision</p>
                            </div>
                        </div>
                        <button onClick={performAnalysis} disabled={isAnalyzing} className="px-10 py-3 bg-red-600 hover:bg-red-500 text-white rounded-2xl font-black shadow-2xl transition transform active:scale-95 flex items-center gap-2 text-sm uppercase tracking-widest">
                            <i data-lucide="zap" className={`w-4 h-4 ${isAnalyzing ? 'animate-pulse' : ''}`}></i>啟動全量分析
                        </button>
                    </header>

                    <div className="main-content">
                        {/* Column 1: Input */}
                        <div className="lg:col-span-3 content-col">
                            <div className={`glass-panel rounded-3xl p-6 flex-1 flex flex-col shadow-xl transition-all ${isDragging ? 'drag-active' : ''}`}
                                 onDragOver={handleDragOver} onDragLeave={handleDragLeave} onDrop={handleDrop}>
                                <h2 className="font-bold flex items-center gap-2 mb-4 text-slate-400 text-xs uppercase tracking-widest border-b border-white/5 pb-2">
                                    <i data-lucide="file-text" className="text-blue-500 w-3 h-3"></i> 情資來源內容 (TXT可拖入)
                                </h2>
                                <textarea value={inputText} onChange={(e) => setInputText(e.target.value)} className="flex-1 w-full bg-slate-950/40 border border-white/5 rounded-2xl p-4 text-[13px] text-slate-300 focus:ring-1 focus:ring-red-600 outline-none transition resize-none placeholder-slate-800 font-mono custom-scrollbar leading-relaxed" placeholder="在此貼上文本內容..."/>
                                
                                <div className="mt-4 pt-4 border-t border-white/5 opacity-60 hover:opacity-100 transition-all flex justify-between items-end text-[10px]">
                                    <div className="space-y-1">
                                        <p className="font-bold text-slate-500 uppercase font-black">Author Research</p>
                                        <a href="https://chiakai-chang.github.io/CKTools" target="_blank" className="font-bold author-link flex items-center gap-1"><i data-lucide="external-link" className="w-2.5 h-2.5 text-blue-400"></i> 科偵軍火庫</a>
                                    </div>
                                    <div className="flex gap-3">
                                        <a href="mailto:lotifv@gmail.com" title="Email"><i data-lucide="mail" className="w-4 h-4 author-link"></i></a>
                                        <a href="https://github.com/Chiakai-Chang" target="_blank" title="GitHub"><i data-lucide="github" className="w-4 h-4 author-link"></i></a>
                                    </div>
                                </div>
                            </div>
                        </div>

                        {/* Column 2: Data List (Scrollable) */}
                        <div className="lg:col-span-3 glass-panel rounded-3xl content-col shadow-xl overflow-hidden">
                            <div className="p-5 border-b border-white/5 space-y-4 bg-slate-900/40 flex-none">
                                <div className="flex justify-between items-center">
                                    <h2 className="font-bold flex items-center gap-2 text-slate-400 text-xs uppercase tracking-widest font-black"><i data-lucide="table" className="text-red-500 w-3 h-3"></i> 關鍵特徵分析報告</h2>
                                    <span className="text-[10px] font-mono bg-slate-950 px-2 py-0.5 rounded-lg opacity-50 font-black">{filteredWords.length} 筆</span>
                                </div>
                                <div className="space-y-3">
                                    <select value={categoryFilter} onChange={(e) => setCategoryFilter(e.target.value)} className="w-full bg-slate-800 border border-white/10 rounded-xl px-3 py-2 text-[10px] text-slate-200 outline-none cursor-pointer font-bold">
                                        <option value="全部">所有類別 (全部結果)</option>
                                        <option value="行動/武器">行動/武器 (威脅)</option>
                                        <option value="目標場所">目標場所 (設施)</option>
                                        <option value="政治人物/暱稱">政治人物/暱稱</option>
                                        <option value="群體/身分">群體/身分 (組織)</option>
                                        <option value="識別特徵碼">識別特徵碼</option>
                                    </select>
                                    <div className="flex flex-wrap gap-1.5">
                                        {['極高危', '高風險', '中風險'].map(label => (
                                            <button key={label} onClick={() => toggleRiskFilter(label)} className={`px-2 py-1 rounded-lg text-[9px] font-black border transition-all ${selectedRisks.includes(label) ? (label === '極高危' ? 'bg-red-600 border-red-400 text-white shadow-[0_0_8px_#ef4444]' : label === '高風險' ? 'bg-orange-600 border-orange-400 text-white' : 'bg-yellow-600 border-yellow-400 text-black') : 'bg-slate-800/50 border-white/10 text-slate-500 hover:border-white/30'}`}>{label}</button>
                                        ))}
                                        {selectedRisks.length > 0 && <button onClick={() => setSelectedRisks([])} className="px-2 py-1 text-[9px] text-blue-400 hover:text-white font-bold underline decoration-dotted">RESET</button>}
                                    </div>
                                </div>
                            </div>
                            <div className="flex-1 overflow-y-auto custom-scrollbar">
                                <table className="w-full text-left text-[11px]">
                                    <thead className="sticky top-0 z-10 bg-[#0c1322] shadow-md text-slate-500 uppercase text-[9px] font-black tracking-widest">
                                        <tr><th className="px-4 py-2 border-b border-white/10">情資熱點</th><th className="px-4 py-2 border-b border-white/10 text-right">分級</th></tr>
                                    </thead>
                                    <tbody className="divide-y divide-white/5">
                                        {filteredWords.map((word, idx) => {
                                            const riskL = getRiskLevel(SUSPECTS.has(word.text) ? 100 : word.sentiment);
                                            const isH = SUSPECTS.has(word.text) || (SENTIMENT_MAP[word.text] || 0) >= 95;
                                            return (
                                                <tr key={idx} className="risk-row transition">
                                                    <td className="px-4 py-3.5">
                                                        <div className="flex items-center gap-2">
                                                            <span className={`font-black tracking-tight ${isH ? "suspect-highlight" : "text-slate-300"}`}>{word.text}</span>
                                                            <span className="text-[10px] text-blue-500/40 font-black">x{word.count}</span>
                                                        </div>
                                                        <span className="text-[9px] text-slate-600 block italic opacity-70 font-medium tracking-tight uppercase">{word.category}</span>
                                                    </td>
                                                    <td className="px-4 py-3.5 text-right">
                                                        <span className={`px-2 py-0.5 rounded-[4px] text-[8px] font-black border ${getRiskColor(SUSPECTS.has(word.text) ? 100 : word.sentiment)} uppercase tracking-tighter`}>{riskL}</span>
                                                    </td>
                                                </tr>
                                            );
                                        })}
                                    </tbody>
                                </table>
                            </div>
                        </div>

                        {/* Column 3: Visual Charts */}
                        <div className="lg:col-span-6 content-col gap-6">
                            <div className="glass-panel rounded-3xl p-6 flex-1 flex flex-col shadow-2xl relative min-h-0 overflow-hidden">
                                <div className="flex justify-between items-center mb-3 border-b border-white/5 pb-2">
                                    <h2 className="font-bold flex items-center gap-2 text-slate-400 text-xs uppercase tracking-widest font-black"><i data-lucide="cloud" className="text-blue-500 w-3 h-3"></i> 語義熱度全景圖 (自動適配)</h2>
                                    <div className="flex items-center gap-2">
                                        <input type="range" min="0.3" max="2" step="0.1" value={zoom} onChange={(e) => setZoom(parseFloat(e.target.value))} className="w-16 h-1 accent-blue-500 cursor-pointer"/>
                                        <button onClick={() => setZoom(1)} className="text-[9px] font-bold text-slate-500 hover:text-white font-black uppercase tracking-widest">FIT</button>
                                    </div>
                                </div>
                                <div ref={viewportRef} className="flex-1 canvas-viewport">
                                    <div className="canvas-container" style={{ transform: `scale(${zoom})` }}><canvas ref={cloudCanvasRef}></canvas></div>
                                </div>
                            </div>
                            <div className="glass-panel rounded-3xl p-6 flex-1 flex flex-col shadow-2xl min-h-0 overflow-hidden text-center">
                                <h2 className="font-bold flex items-center gap-2 mb-3 text-slate-400 text-xs uppercase tracking-widest border-b border-white/5 pb-2 font-black text-indigo-400 tracking-tighter">
                                    <i data-lucide="share-2" className="text-indigo-400 w-3 h-3"></i> 情資拓樸全量網 (物理聚落優化)
                                </h2>
                                <div ref={networkRef} className="flex-1 bg-slate-950/30 rounded-2xl border border-white/5 shadow-inner"></div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const mount = () => {
            const container = document.getElementById('root');
            if (container && typeof ReactDOM !== 'undefined') {
                const root = ReactDOM.createRoot(container);
                root.render(<App />);
            } else { setTimeout(mount, 50); }
        };
        mount();
    </script>
</body>
</html>
